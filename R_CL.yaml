# =========================
# PROXY GROUPS
# =========================

proxy-groups:

  - name: "Fastest"
    type: url-test
    url: "https://www.gstatic.com/generate_204"
    interval: 30
    tolerance: 50
    proxies:
      - "Ramtin-SS-PRO"
      - "Ramtin-SS2-PRO"
      - "Ramtin-SS3-PRO"
      - "Ramtin-VMESS-PRO"
      - "Ramtin-VMESS2-PRO"
      - "Ramtin-VMESS3-PRO"

  - name: "Auto"
    type: fallback
    url: "https://www.gstatic.com/generate_204"
    interval: 30
    proxies:
      - "Ramtin-SS-PRO"
      - "Ramtin-SS2-PRO"
      - "Ramtin-SS3-PRO"
      - "Ramtin-VMESS-PRO"
      - "Ramtin-VMESS2-PRO"
      - "Ramtin-VMESS3-PRO"

  - name: "Load-Balance"
    type: load-balance
    strategy: round-robin
    interval: 30
    url: "https://www.gstatic.com/generate_204"
    proxies:
      - "Ramtin-SS-PRO"
      - "Ramtin-SS2-PRO"
      - "Ramtin-SS3-PRO"
      - "Ramtin-VMESS-PRO"
      - "Ramtin-VMESS2-PRO"
      - "Ramtin-VMESS3-PRO"

  - name: "Select"
    type: select
    proxies:
      - "Fastest"
      - "Auto"
      - "Load-Balance"
      - "Ramtin-SS-PRO"
      - "Ramtin-SS2-PRO"
      - "Ramtin-SS3-PRO"
      - "Ramtin-VMESS-PRO"
      - "Ramtin-VMESS2-PRO"
      - "Ramtin-VMESS3-PRO"
      - DIRECT

rules:
  - GEOIP,IR,DIRECT
  - MATCH,Select
